<!DOCTYPE html>
<!--
  統合シェル（タブの器）。ここは原則いじらない。
  タブは明朝／前夜／🧘ストレッチ。「組む」は残り時間ボタン（#left）が兼ねる：
    🌅明朝  = morning.html の内部タブ "morning"
    🌙前夜  = morning.html の内部タブ "night"
    🧘      = morning.html の内部タブ "stretch"（絵文字だけの小さいタブ）
    ✏️組む  = plan.html（自分で1日を組む。実行中もここを見る）
             → 「22:00 まで ○時間○分 ✏️組む」のボタンで開く
  ※かつてあった「今日の予定」タブ（today.html のチェックリスト）は
    組むタブと役割が重複するため廃止。today.html 自体は残してある。
  チェックリスト本体は同リポジトリの morning.html（同一オリジン）。iframe内のタブを直接クリックし、
  内部のタブバーは隠してタブの二重表示をなくしている。
  （もし向こうのDOM構造が変わっても、隠せないだけで壊れないようにしてある）
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日の段取り</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="段取り">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e7eaf0; --sub:#8b93a3;
    --accent:#4f8cff; --morning:#e0a63c; --night:#7b6cf6;
  }
  /* 朝ルーティンに合わせて常時ダーク（ライトモードには追従しない） */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  /* タブ帯: 画面いっぱいに広げず、本文と同じ幅に収めて中央寄せ */
  .tabbar{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
    padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  .tabs{display:flex;gap:4px;flex:1 1 auto;max-width:560px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  /* 「組む」タブ兼 22時までの残り時間。押すとプランナーが開く。
     タブ帯の中に3つ並べるより、残り時間そのものを入口にしたほうが目に入る。 */
  .left{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    background:rgba(79,140,255,.14);border:1px solid rgba(79,140,255,.45);color:#cfe0ff;
    border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:700;
    font-variant-numeric:tabular-nums;font-family:inherit;cursor:pointer;
    transition:background .15s,border-color .15s}
  .left b{font-size:15px}
  /* 何のボタンかを示す小さな札。区切り線を入れて残り時間と読み分けられるようにする */
  .left .pen{font-size:11px;font-weight:700;opacity:.85;
    border-left:1px solid currentColor;padding-left:8px}
  .left:hover{background:rgba(79,140,255,.22)}
  /* 選択中は紫のリング。色は warn（赤）に上書きされてもリングだけは残る */
  .left.on{background:rgba(138,99,210,.22);border-color:#8a63d2;color:#e9dcff;
    box-shadow:0 0 0 2px rgba(138,99,210,.45)}
  .left.warn{background:rgba(255,93,93,.14);border-color:rgba(255,93,93,.5);color:#ffc2c2}
  .left.warn:hover{background:rgba(255,93,93,.2)}
  @media (max-width:560px){ .left{flex:1 0 100%;justify-content:center} }
  .tab{flex:1 1 0;min-width:0;text-align:center;padding:8px 4px;border:0;
    border-radius:9px;background:transparent;color:var(--sub);font-size:12.5px;font-weight:700;
    cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .15s,color .15s}
  .tab:not(.on):hover{color:var(--text);background:rgba(255,255,255,.05)}
  .tab.on{color:#fff}
  #tabM.on{background:var(--morning)}
  #tabN.on{background:var(--night)}
  #tabS.on{background:#3f8f6b}
  /* 絵文字だけの小さいタブ。他のタブと幅を分け合わず、必要なぶんだけ取る */
  .tab-mini{flex:0 0 auto;padding:8px 12px;font-size:15px}
  .panes{flex:1 1 auto;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  iframe.on{display:block}
</style>
</head>
<body>
<div class="tabbar">
  <div class="tabs">
    <div class="tab" id="tabM">🌅 明朝</div>
    <div class="tab" id="tabN">🌙 前夜</div>
    <div class="tab tab-mini" id="tabS" title="柔軟・ストレッチ">🧘</div>
  </div>
  <button class="left" id="left" type="button"
          title="今日の22:00までの残り時間。押すと「組む」（デイプランナー）を開く"></button>
</div>
<div class="panes">
  <!-- src は JS から付与（morning.html も更新が即反映されるように） -->
  <iframe id="fM" title="朝ルーティン"></iframe>
  <!-- src は JS から付与（plan.html も更新が即反映されるように） -->
  <iframe id="fP" title="デイプランナー"></iframe>
</div>

<script>
  var fM = document.getElementById('fM'), fP = document.getElementById('fP');
  // 外部から ?tab=p&day=next で呼ばれたら、プランナーを翌日で開く
  var Q = new URLSearchParams(location.search);
  var planQ = 'plan.html?t=' + Date.now();
  if(Q.get('day') === 'next'){
    var nx = new Date(); nx.setDate(nx.getDate() + 1);
    var p2 = function(n){ return (n<10?'0':'')+n; };
    planQ += '&date=' + nx.getFullYear() + '-' + p2(nx.getMonth()+1) + '-' + p2(nx.getDate());
  }else if(Q.get('date')){
    planQ += '&date=' + encodeURIComponent(Q.get('date'));
  }
  fP.src = planQ;                          // 10分キャッシュで古い版が動くのを防ぐ
  fM.src = 'morning.html?t=' + Date.now(); // 同上。チェックリストも同じリポジトリの morning.html が正
  var BTN = { m: document.getElementById('tabM'),      // 「組む」はタブ帯ではなく
              n: document.getElementById('tabN'),        // 残り時間のボタン（#left）が担当する
              s: document.getElementById('tabS') };      // 🧘 = ストレッチ
  var leftEl = document.getElementById('left');
  var TABS = ['m', 'p', 'n', 's'];                       // 有効なタブ名（これ以外の指定は無視する）
  var cur = null;                                        // 今どれを見ているか（チップの選択表示に使う）
  var INNER = { m: 'morning', n: 'night', s: 'stretch' };   // morning.html 側の data-t
  var KEY = 'shell-tab';
  var wanted = null;   // 朝アプリで表示したい内部タブ

  // 「今日の予定」タブと重複するブロックは朝タブ側で隠す（埋め込み時のみ。morning.html 単体では出る）
  //   m2a = 簿記2級（→ 予定タブの「資格勉強120分」）
  //   m4a = ブログ執筆（→ 予定タブの「ブログ記事執筆」）
  var DUP = ['m2a', 'm4a'];
  // チェックボックスを持たない装飾ブロックはテキストで特定して隠す
  //   （文言が変わった場合は隠れないだけで、表示は壊れない）
  var DUP_TEXT = ['EC業務スタンバイ'];

  // iframe内(同一オリジン)のタブを操作し、内部タブバーと重複ブロックを隠す
  function applyInner(name){
    try{
      var doc = fM.contentDocument;
      if(!doc || !doc.body) return false;
      if(!doc.getElementById('shell-hide-tabs')){
        var st = doc.createElement('style');
        st.id = 'shell-hide-tabs';
        st.textContent = '.tabs{display:none !important}';
        (doc.head || doc.documentElement).appendChild(st);
      }
      DUP.forEach(function(id){
        var input = doc.querySelector('input[data-id="' + id + '"]');
        if(!input) return;                       // 見つからなければ何もしない
        var blk = input.closest('.block');
        if(blk) blk.style.display = 'none';
      });
      Array.prototype.forEach.call(doc.querySelectorAll('#morning .block'), function(blk){
        var txt = blk.textContent || '';
        for(var i = 0; i < DUP_TEXT.length; i++){
          if(txt.indexOf(DUP_TEXT[i]) !== -1){ blk.style.display = 'none'; return; }
        }
      });
      var t = doc.querySelector('.tab[data-t="' + name + '"]');
      if(!t) return false;
      t.click();
      return true;
    }catch(e){ return false; }   // 構造変更や取得失敗時は何もしない（元の表示に戻るだけ）
  }
  fM.addEventListener('load', function(){ if(wanted) applyInner(wanted); });

  function today(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }


  function show(which, remember){
    cur = which;
    for(var k in BTN){ BTN[k].classList.toggle('on', k === which); }
    var useMorning = (which !== 'p');            // 組む以外は morning.html の中身を出す
    fM.classList.toggle('on', useMorning);
    fP.classList.toggle('on', which === 'p');
    if(useMorning){
      wanted = INNER[which];
      applyInner(wanted);          // 読み込み済みなら即反映。未了ならload時に反映
    }
    if(remember){
      try{ localStorage.setItem(KEY, JSON.stringify({d: today(), t: which})); }catch(e){}
    }
    drawLeft();                    // 残り時間ボタンの選択表示も合わせる
  }
  // 中身（morning.html）からタブを切り替えられるように公開する
  window.showTab = show;
  BTN.m.addEventListener('click', function(){ show('m', true); });
  BTN.n.addEventListener('click', function(){ show('n', true); });
  BTN.s.addEventListener('click', function(){ show('s', true); });
  leftEl.addEventListener('click', function(){ show('p', true); });

  // 初期表示: 同じ日に手動で選んだタブがあればそれを、なければ時刻で判断
  //   4:00–11:59 → 明朝 / 12:00–19:59 → 今日の予定 / 20:00–3:59 → 前夜の準備
  (function(){
    var pick = null;
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(s && s.d === today() && TABS.indexOf(s.t) >= 0) pick = s.t;   // 廃止したタブ名は無視される
    }catch(e){}
    var forced = Q.get('tab');             // 外部リンクからの指定が最優先
    if(forced && TABS.indexOf(forced) >= 0) pick = forced;
    if(!pick){
      var h = new Date().getHours();
      pick = (h >= 4 && h < 12) ? 'm' : (h >= 20 || h < 4) ? 'n' : 'p';
    }
    show(pick, false);
  })();

  /* 22時までの残り時間。どのタブを見ていても目に入るようにシェル側で出す。
     （プランナー内の同じ表示は、埋め込み時は二重になるので向こうで隠している） */
  var DAY_END = 22*60;
  function drawLeft(){
    var el = leftEl;
    var n = new Date(), rest = DAY_END - (n.getHours()*60 + n.getMinutes());
    var over = rest < 0, m = Math.abs(rest);
    var txt = m >= 60 ? Math.floor(m/60)+'時間'+(m%60 ? (m%60)+'分' : '') : m+'分';
    el.className = 'left' + (rest < 60 ? ' warn' : '')      // 残り1時間を切ったら赤
                          + (cur === 'p' ? ' on' : '');     // 表示中なら選択状態
    el.textContent = '';
    el.appendChild(document.createTextNode(over ? '22:00 から' : '22:00 まで'));
    var b = document.createElement('b'); b.textContent = txt; el.appendChild(b);
    if(over) el.appendChild(document.createTextNode('経過'));
    var pen = document.createElement('span');               // 何のボタンかを示す札
    pen.className = 'pen'; pen.textContent = '✏️ 組む';
    el.appendChild(pen);
  }
  drawLeft();
  setInterval(drawLeft, 30000);
  // スリープ復帰・タブ復帰で古い数字が残らないように取り直す
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) drawLeft(); });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
