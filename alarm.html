<!DOCTYPE html>
<!--
  ⏰ 目覚まし（段取りPWA の ⏰ タブ）。2026-11-08。
  iPhone → GAS「目覚まし中継（段取りPWA）」→ 非公開スプシ → Mac（wake_sync.py が10分おきに反映）。
  つなぎ先（GAS の URL）と合言葉は公開リポジトリに載せない。端末ごとに localStorage（alarmUrl / alarmKey）へ覚えさせる。
  初回は alarm.html#setup=<URL>|<合言葉> を開くと覚える（# 以降はサーバーに送られない）。⚙ からも入れられる。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>目覚まし</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e7eaf0;--sub:#8b93a3;
        --accent:#4f8cff;--ok:#3f8f6b;--warn:#e0a63c;--ng:#ff5d5d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .ttl{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .sub{color:var(--sub);font-size:12.5px}
  .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row b{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .pill.ok{background:rgba(63,143,107,.2);color:#8fe0b9}
  .pill.warn{background:rgba(224,166,60,.18);color:#ffd28a}
  .pill.ng{background:rgba(255,93,93,.16);color:#ffb3b3}
  .note{border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
  .note.warn{background:rgba(224,166,60,.12);border:1px solid rgba(224,166,60,.4);color:#ffe0a8}
  .note.ng{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4);color:#ffc2c2}
  input,button{font:inherit;color:var(--text)}
  input{background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
  input[type=time],input[type=date]{min-height:42px}
  button{background:var(--accent);border:0;border-radius:10px;padding:10px 14px;font-weight:700;color:#fff;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
  button:disabled{opacity:.5}
  .line{display:flex;gap:8px;align-items:center;margin-top:8px}
  .line > *{flex:1 1 0}
  .line > button{flex:0 0 auto}
  .off{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .off:last-child{border-bottom:0}
  .off button{padding:4px 10px;font-size:12px}
  pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:13.5px;font-variant-numeric:tabular-nums}
  #msg{position:sticky;top:0;z-index:2}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="msg"></div>

  <div class="card" id="setupCard">
    <div class="ttl">⚙ つなぎ先 <button class="ghost" id="setupClose" type="button">閉じる</button></div>
    <div class="sub">GAS「目覚まし中継（段取りPWA）」の URL と合言葉。この端末にだけ覚えます。</div>
    <div class="line"><input id="inUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
    <div class="line"><input id="inKey" placeholder="合言葉" autocomplete="off"><button id="saveSetup" type="button">保存</button></div>
  </div>

  <div class="card">
    <div class="ttl"><span>⏰ 次の朝</span><span id="macPill" class="pill"></span></div>
    <div id="next" class="big">―</div>
    <div id="rows"></div>
    <div id="notes"></div>
  </div>

  <div class="card">
    <div class="ttl">起床時間を変える</div>
    <div class="sub">ラジオとランプは15分前に、目覚ましはこの時刻に。次に変えるまで毎日。Mac が10分以内に反映します。</div>
    <div class="line"><input type="time" id="wake" step="300"><button id="setWake" type="button">変える</button></div>
  </div>

  <div class="card">
    <div class="ttl">お休み（鳴らさない日）</div>
    <div class="sub">旅行などでラジオと目覚ましを鳴らさない日。ランプは止まりません。</div>
    <div class="line"><input type="date" id="from"><input type="date" id="to"></div>
    <div class="line"><input id="memo" placeholder="メモ（任意）"><button id="addOff" type="button">足す</button></div>
    <div id="offs" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="ttl">直近7日</div>
    <pre id="recent" class="sub">―</pre>
  </div>

  <div class="sub" style="text-align:center">
    <span id="updated"></span>　<a href="#" id="reload" style="color:var(--accent)">読み直す</a>　<a href="#" id="openSetup" style="color:var(--sub)">⚙</a>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LS = window.localStorage;
  // 初回の設定：alarm.html#setup=<URL>|<合言葉>
  var h = decodeURIComponent(location.hash || '');
  if(h.indexOf('#setup=') === 0){
    var parts = h.slice(7).split('|');
    if(parts.length === 2){ LS.setItem('alarmUrl', parts[0]); LS.setItem('alarmKey', parts[1]); }
    history.replaceState(null, '', location.pathname);
  }
  function conf(){ return { url: LS.getItem('alarmUrl') || '', key: LS.getItem('alarmKey') || '' }; }
  function showSetup(on){ $('setupCard').classList.toggle('hide', !on); var c = conf(); $('inUrl').value = c.url; $('inKey').value = c.key; }
  showSetup(!conf().url);

  function msg(text, kind){
    $('msg').innerHTML = text ? '<div class="note ' + (kind || 'warn') + '">' + text + '</div>' : '';
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function mins(t){ var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function hm(n){ return Math.floor(n / 60) + ':' + ('0' + (n % 60)).slice(-2); }

  function call(params){
    var c = conf();
    if(!c.url || !c.key){ showSetup(true); return Promise.reject(new Error('つなぎ先が未設定')); }
    var q = 'key=' + encodeURIComponent(c.key);
    for(var k in params) q += '&' + k + '=' + encodeURIComponent(params[k]);
    return fetch(c.url + (c.url.indexOf('?') < 0 ? '?' : '&') + q, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(!d.ok) throw new Error(d.error === 'key' ? '合言葉が違います' : d.error); return d; });
  }

  function draw(d){
    var s = d.status || {};
    var alarm = s['起床（目覚まし）'] || '', radio = s['ラジオ開始'] || '';
    $('next').textContent = s['次の朝'] || '―';
    var rows = [
      ['ラジオ・ランプ', radio || '―'],
      ['目覚まし', alarm || '―']
    ];   // 「ラジオの止まる保険」「ランプ（最後に確かめた）」は 2026-11-08 本人の希望で非表示（ランプのずれは下の注意書きで出す）
    $('rows').innerHTML = rows.map(function(r){ return '<div class="row"><span class="sub">' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('');
    var notes = [];
    if(d.wake && alarm && mins(d.wake) !== mins(alarm))
      notes.push(['warn', '起床 ' + esc(d.wake) + ' への変更は反映待ちです（Mac が10分以内に反映）']);
    var lampNow = s['ランプ（最後に確かめた時刻）'], lampWant = s['ランプのあるべき時刻'];
    if(lampNow && lampWant && mins(lampNow) !== mins(lampWant))
      notes.push(['warn', 'ランプは ' + esc(lampNow) + ' のままです（あるべき時刻 ' + esc(lampWant) + '）。Mac の Claude に「ランプ合わせて」と伝えてください']);
    if((s['次の朝'] || '').indexOf('お休み') >= 0)
      notes.push(['warn', '次の朝はお休みです。ラジオと目覚ましは鳴りません（ランプは光ります）']);
    if(s['最後の変更']) notes.push(['ok', esc(s['最後の変更']).replace(/\n/g, '<br>')]);
    $('notes').innerHTML = notes.map(function(n){ return '<div class="note ' + (n[0] === 'ok' ? '' : n[0]) + '" style="' + (n[0] === 'ok' ? 'color:var(--sub);border:1px solid var(--line)' : '') + '">' + n[1] + '</div>'; }).join('');
    // Mac が最後に確かめに来た時刻
    var seen = s['Mac確認'] ? new Date(s['Mac確認'].replace(' ', 'T') + ':00+09:00') : null;
    var age = seen ? Math.round((Date.now() - seen.getTime()) / 60000) : null;
    var p = $('macPill');
    if(age === null){ p.className = 'pill ng'; p.textContent = 'Mac 未確認'; }
    else { p.className = 'pill ' + (age <= 25 ? 'ok' : 'ng'); p.textContent = 'Mac ' + (age < 1 ? 'たった今' : age < 120 ? age + '分前' : Math.round(age / 60) + '時間前'); }
    if(age !== null && age > 25) msg('Mac が ' + p.textContent.replace('Mac ', '') + 'から確認に来ていません。Mac がスリープしていないか確かめてください', 'ng');
    // 入力欄
    if(!$('wake').dataset.touched) $('wake').value = ('0' + (d.wake || alarm || '5:30')).slice(-5);
    $('offs').innerHTML = (d.off || []).length ? d.off.map(function(o){
      var dt = new Date(o.date + 'T12:00:00+09:00');
      var w = '日月火水木金土'.charAt(dt.getDay());
      return '<div class="off"><span>' + esc(o.date.slice(5).replace('-', '/')) + '（' + w + '）' + (o.memo ? '　<span class="sub">' + esc(o.memo) + '</span>' : '') +
             '</span><button class="ghost" data-del="' + esc(o.date) + '" type="button">消す</button></div>';
    }).join('') : '<div class="sub">なし</div>';
    $('recent').textContent = s['直近7日'] || '―';
    $('updated').textContent = '読込 ' + new Date().toTimeString().slice(0, 5);
  }

  function load(){
    msg('');
    return call({ action: 'state' }).then(draw).catch(function(e){ msg('読み込めませんでした：' + esc(e.message), 'ng'); });
  }
  function act(btn, params, done){
    btn.disabled = true;
    call(params).then(function(d){ draw(d); if(done) done(); })
      .catch(function(e){ msg(esc(e.message), 'ng'); })
      .then(function(){ btn.disabled = false; });
  }

  $('wake').addEventListener('input', function(){ this.dataset.touched = '1'; });
  $('setWake').addEventListener('click', function(){
    var v = $('wake').value; if(!v) return;
    var t = (+v.slice(0, 2)) + ':' + v.slice(3, 5);
    act(this, { action: 'set_wake', time: t }, function(){ delete $('wake').dataset.touched; msg('起床 ' + t + ' を送りました。Mac が10分以内に反映します', 'warn'); });
  });
  $('addOff').addEventListener('click', function(){
    var f = $('from').value, t = $('to').value || f; if(!f) { msg('お休みの最初の日を選んでください', 'warn'); return; }
    act(this, { action: 'add_off', from: f, to: t, memo: $('memo').value }, function(){ $('memo').value = ''; });
  });
  $('offs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-del]'); if(!b) return;
    if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'もう一度押すと消す'; return; }
    act(b, { action: 'del_off', date: b.dataset.del });
  });
  $('saveSetup').addEventListener('click', function(){
    LS.setItem('alarmUrl', $('inUrl').value.trim()); LS.setItem('alarmKey', $('inKey').value.trim());
    showSetup(false); load();
  });
  $('setupClose').addEventListener('click', function(){ showSetup(false); });
  $('openSetup').addEventListener('click', function(e){ e.preventDefault(); showSetup(true); });
  $('reload').addEventListener('click', function(e){ e.preventDefault(); load(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
  if(conf().url) load();
})();
</script>
</body>
</html>
